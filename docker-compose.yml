# ToggleMaster v2 — local environment.
# Target: 5 apps + 2 PostgreSQL + Redis + DynamoDB Local (9 containers).
# Services are added one at a time.

# Both PostgreSQL instances use the same image; SERVICE_DATABASES picks the
# databases each one creates (see postgres/init-service-databases.sh).
x-postgres: &postgres
  build:
    context: ..
    dockerfile: togglemaster-v2/postgres/Dockerfile
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
    interval: 5s
    timeout: 5s
    retries: 10

# Settings shared by everything that talks to the local AWS emulators.
# The emulators accept any credentials; these are placeholders, not secrets.
x-aws-local: &aws-local
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  SQS_QUEUE_NAME: ${SQS_QUEUE_NAME}
  DYNAMODB_TABLE: ${DYNAMODB_TABLE}

services:
  # PostgreSQL instance #1 hosts auth_db and flags_db.
  postgres-auth-flags:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_DATABASES: auth flags
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      FLAGS_DB_PASSWORD: ${FLAGS_DB_PASSWORD}
    volumes:
      - postgres-auth-flags-data:/var/lib/postgresql/data

  # PostgreSQL instance #2 hosts targeting_db.
  postgres-targeting:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_DATABASES: targeting
      TARGETING_DB_PASSWORD: ${TARGETING_DB_PASSWORD}
    volumes:
      - postgres-targeting-data:/var/lib/postgresql/data

  auth-service:
    build: ../auth-service
    environment:
      PORT: "8001"
      DATABASE_URL: postgres://auth_user:${AUTH_DB_PASSWORD}@postgres-auth-flags:5432/auth_db?sslmode=disable
      MASTER_KEY: ${MASTER_KEY}
    ports:
      - "8001:8001"
    depends_on:
      postgres-auth-flags:
        condition: service_healthy

  flag-service:
    build: ../flag-service
    environment:
      DATABASE_URL: postgres://flags_user:${FLAGS_DB_PASSWORD}@postgres-auth-flags:5432/flags_db
      AUTH_SERVICE_URL: http://auth-service:8001
    ports:
      - "8002:8002"
    depends_on:
      postgres-auth-flags:
        condition: service_healthy
      auth-service:
        condition: service_started

  targeting-service:
    build: ../targeting-service
    environment:
      DATABASE_URL: postgres://targeting_user:${TARGETING_DB_PASSWORD}@postgres-targeting:5432/targeting_db
      AUTH_SERVICE_URL: http://auth-service:8001
    ports:
      - "8003:8003"
    depends_on:
      postgres-targeting:
        condition: service_healthy
      auth-service:
        condition: service_started

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  evaluation-service:
    build: ../evaluation-service
    environment:
      PORT: "8004"
      REDIS_URL: redis://redis:6379
      FLAG_SERVICE_URL: http://flag-service:8002
      TARGETING_SERVICE_URL: http://targeting-service:8003
      # Created after auth-service is up: POST /admin/keys (see README).
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      <<: *aws-local
      AWS_SQS_URL: http://elasticmq:9324/000000000000/${SQS_QUEUE_NAME}
      AWS_ENDPOINT_URL_SQS: http://elasticmq:9324
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy
      flag-service:
        condition: service_started
      targeting-service:
        condition: service_started
      aws-init:
        condition: service_completed_successfully

  # --- Local AWS emulators (the apps reach them via AWS_ENDPOINT_URL_*) ---

  # DynamoDB Local: in-memory, data is lost on restart.
  dynamodb-local:
    image: amazon/dynamodb-local:3.1.0
    ports:
      - "8000:8000"

  # SQS emulator. LocalStack now requires an account token, so ElasticMQ
  # (open source, SQS-compatible) is used instead.
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.14
    ports:
      - "9324:9324"

  # One-shot job: creates the SQS queue and the DynamoDB table, then exits.
  # Plays the role of init.sql for the AWS emulators.
  aws-init:
    image: amazon/aws-cli:2.38.2
    environment:
      <<: *aws-local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until aws sqs list-queues --endpoint-url http://elasticmq:9324 >/dev/null 2>&1; do
          echo "waiting for elasticmq..."; sleep 2
        done
        aws sqs create-queue --queue-name "$$SQS_QUEUE_NAME-dlq" --endpoint-url http://elasticmq:9324
        DLQ_ARN=$$(aws sqs get-queue-attributes --endpoint-url http://elasticmq:9324 \
          --queue-url "http://elasticmq:9324/000000000000/$$SQS_QUEUE_NAME-dlq" \
          --attribute-names QueueArn --query Attributes.QueueArn --output text)
        # After 3 failed receives a message (poison pill) moves to the DLQ.
        aws sqs create-queue --queue-name "$$SQS_QUEUE_NAME" --endpoint-url http://elasticmq:9324 \
          --attributes "{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"$$DLQ_ARN\\\",\\\"maxReceiveCount\\\":\\\"3\\\"}\"}"
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do
          echo "waiting for dynamodb-local..."; sleep 2
        done
        aws dynamodb describe-table --table-name "$$DYNAMODB_TABLE" --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1 ||
        aws dynamodb create-table --table-name "$$DYNAMODB_TABLE" \
          --attribute-definitions AttributeName=event_id,AttributeType=S \
          --key-schema AttributeName=event_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000
        echo "AWS emulators initialized"
    depends_on:
      - elasticmq
      - dynamodb-local

  analytics-service:
    build: ../analytics-service
    environment:
      <<: *aws-local
      AWS_SQS_URL: http://elasticmq:9324/000000000000/${SQS_QUEUE_NAME}
      AWS_DYNAMODB_TABLE: ${DYNAMODB_TABLE}
      AWS_ENDPOINT_URL_SQS: http://elasticmq:9324
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
    ports:
      - "8005:8005"
    depends_on:
      aws-init:
        condition: service_completed_successfully

volumes:
  postgres-auth-flags-data:
  postgres-targeting-data:

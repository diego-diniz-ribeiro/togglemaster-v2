# Non-secret settings for AWS (EKS). Endpoints of the managed services created
# in the AWS Academy Learner Lab account. No AWS keys here: the SDKs use the
# node role (LabRole) through the instance metadata service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: togglemaster-app
data:
  PORT: "8001"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-service-config
  namespace: togglemaster-app
data:
  AUTH_SERVICE_URL: http://auth-service:8001
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: targeting-service-config
  namespace: togglemaster-app
data:
  AUTH_SERVICE_URL: http://auth-service:8001
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-service-config
  namespace: togglemaster-app
data:
  PORT: "8004"
  # ElastiCache (Redis 7.1)
  REDIS_URL: redis://togglemaster-redis.6lihaz.0001.use1.cache.amazonaws.com:6379
  FLAG_SERVICE_URL: http://flag-service:8002
  TARGETING_SERVICE_URL: http://targeting-service:8003
  AWS_REGION: us-east-1
  AWS_SQS_URL: https://sqs.us-east-1.amazonaws.com/992382833534/togglemaster-evaluations
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-service-config
  namespace: togglemaster-app
data:
  AWS_REGION: us-east-1
  AWS_SQS_URL: https://sqs.us-east-1.amazonaws.com/992382833534/togglemaster-evaluations
  AWS_DYNAMODB_TABLE: ToggleMasterAnalytics

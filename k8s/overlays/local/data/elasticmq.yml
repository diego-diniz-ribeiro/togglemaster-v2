apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
  namespace: togglemaster-data
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: elasticmq
  template:
    metadata:
      labels:
        app: elasticmq
    spec:
      containers:
        - name: elasticmq
          image: softwaremill/elasticmq-native:1.6.14
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9324
          readinessProbe:
            httpGet:
              path: /?Action=ListQueues
              port: 9324
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /?Action=ListQueues
              port: 9324
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticmq
  namespace: togglemaster-data
spec:
  type: ClusterIP
  selector:
    app: elasticmq
  ports:
    - port: 9324
      targetPort: 9324
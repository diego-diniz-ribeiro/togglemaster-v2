apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: togglemaster-app
spec:
  # No "replicas": the HorizontalPodAutoscaler below owns the replica count.
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # "app" user created in the Dockerfile
      containers:
        - name: evaluation-service
          image: evaluation-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
          envFrom:
            - configMapRef:
                name: evaluation-service-config
            # Created after auth-service is up (k8s/scripts/bootstrap-service-key.sh).
            - secretRef:
                name: evaluation-service-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # The HPA percentage is computed against this CPU request.
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-service
  namespace: togglemaster-app
spec:
  type: ClusterIP
  selector:
    app: evaluation-service
  ports:
    - name: http
      port: 8004
      targetPort: http
---
# Hot path: scales on CPU when the evaluation load grows.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evaluation-service
  namespace: togglemaster-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evaluation-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      # Default is 300 s; shorter so the scale-down is visible in the demo.
      stabilizationWindowSeconds: 60

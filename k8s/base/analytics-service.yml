apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: togglemaster-app
spec:
  # No "replicas": the HorizontalPodAutoscaler below owns the replica count.
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # "appuser" created in the Dockerfile
      containers:
        - name: analytics-service
          image: analytics-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
          # No Secret: on AWS the SDK uses the node role (LabRole) credentials.
          envFrom:
            - configMapRef:
                name: analytics-service-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: togglemaster-app
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
    - name: http
      port: 8005
      targetPort: http
---
# SQS consumer: KEDA (scaling on queue depth) is not available in the AWS
# Academy lab, so it scales on CPU, which grows with the message volume.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-service
  namespace: togglemaster-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60

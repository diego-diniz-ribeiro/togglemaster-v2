apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # "appuser" created in the Dockerfile
      containers:
        - name: flag-service
          image: flag-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: flag-service-config
            - secretRef:
                name: flag-service-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: togglemaster-app
spec:
  type: ClusterIP
  selector:
    app: flag-service
  ports:
    - name: http
      port: 8002
      targetPort: http
